{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="game-page-header d-flex justify-content-between align-items-center px-2">
        <h2 class="fw-bold m-0">2048</h2>
        <a href="/" class="btn btn-sm btn-outline-arcade btn-return-lobby" data-game="game2048">返回大厅</a>
    </div>

    <div class="game-layout">
        <div class="row justify-content-center align-items-start g-4">
            <div class="col-auto text-center">
                <div class="canvas-container">
                    <canvas id="game2048Canvas" width="500" height="620"></canvas>
                </div>
            </div>
            <div class="col-auto">
                <div class="game-hint-panel">
                    <h6>操作说明</h6>
                    <ul>
                        <li><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 移动方块</li>
                        <li>或使用 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></li>
                        <li>相同数字相撞会合并并加分</li>
                        <li>每次有效移动后随机生成新方块</li>
                    </ul>
                    <p class="hint-goal">目标：尽可能合成 <strong>2048</strong>，棋盘填满且无法合并时游戏结束。</p>
                    <div class="hint-record">最高纪录：{{ fmt_score(records['game_2048'].best_score) }}</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const BEST_SCORE = {{ records['game_2048'].best_score | tojson }};
</script>
<script src="{{ url_for('static', filename='js/game2048.js') }}"></script>
<script src="{{ url_for('static', filename='js/arcade_leave.js') }}"></script>
{% endblock %}
