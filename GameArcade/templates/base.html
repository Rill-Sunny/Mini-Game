<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}数码游戏厅 · Arcade{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block styles %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-arcade sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">游戏厅</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link {% if active_page == 'index' %}active{% endif %}" href="/">大厅首页</a></li>
                    <li class="nav-item"><a class="nav-link {% if active_page == 'game2048' %}active{% endif %}" href="/2048">2048</a></li>
                    <li class="nav-item"><a class="nav-link {% if active_page == 'tetris' %}active{% endif %}" href="/tetris">俄罗斯方块</a></li>
                    <li class="nav-item"><a class="nav-link {% if active_page == 'snake' %}active{% endif %}" href="/snake">贪吃蛇</a></li>
                    <li class="nav-item"><a class="nav-link {% if active_page == 'minesweeper' %}active{% endif %}" href="/minesweeper">经典扫雷</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="py-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-3 footer-arcade mt-auto">
        <div class="container text-center small">
            &copy; 2026 数码游戏厅 · 蓝白简约风格
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
